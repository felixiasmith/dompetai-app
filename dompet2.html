<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>DompetAI - Aplikasi Keuangan</title>
    <script src="https://tailwindcss.com"></script>
    <script defer src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6" x-data="app()">
    <div class="max-w-md mx-auto space-y-6 bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl">
        <div class="flex justify-between items-center border-b border-slate-800 pb-4">
            <h1 class="text-lg font-bold text-emerald-400">💰 DompetAI</h1>
            <span class="text-[10px] bg-blue-500/20 text-blue-400 px-2.5 py-1 rounded-full">Aktif</span>
        </div>
        
        <!-- Saldo Dompet -->
        <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
            <p class="text-xs text-slate-400">Saldo BCA Utama</p>
            <p class="text-2xl font-bold text-emerald-400 mt-1" x-text="'Rp ' + bcaBalance.toLocaleString('id-ID')"></p>
        </div>

        <!-- Input -->
        <div class="space-y-3">
            <input type="text" x-model="text" placeholder="Contoh: gaji 5000000 atau beli makan 50000" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500">
            <button @click="proses()" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-3 rounded-xl text-sm font-semibold transition">Simpan Transaksi</button>
        </div>

        <!-- Riwayat -->
        <div class="border-t border-slate-800 pt-4">
            <p class="text-xs font-semibold text-slate-400 mb-2">Riwayat</p>
            <div class="space-y-2 max-h-40 overflow-y-auto">
                <template x-for="t in list">
                    <div class="flex justify-between items-center bg-slate-950 p-3 rounded-lg text-xs border border-slate-800/60">
                        <span x-text="t.desc"></span>
                        <span class="font-bold" :class="t.type === 'in' ? 'text-emerald-400' : 'text-rose-400'" x-text="(t.type === 'in' ? '+' : '-') + 'Rp ' + t.amount.toLocaleString('id-ID')"></span>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <script>
        function app() {
            return {
                text: '',
                bcaBalance: 18500000,
                list: [{ desc: 'Gaji Awal', amount: 15000000, type: 'in' }],
                proses() {
                    if(!this.text.trim()) return;
                    let val = this.text.toLowerCase();
                    let isInc = val.includes('gaji') || val.includes('dapat');
                    let angka = parseInt(this.text.replace(/[^0-9]/g, '')) || 50000;
                    
                    if(isInc) {
                        this.bcaBalance += angka;
                    } else {
                        this.bcaBalance -= angka;
                    }
                    
                    this.list.unshift({ desc: this.text, amount: angka, type: isInc ? 'in' : 'out' });
                    this.text = '';
                }
            }
        }
    </script>
</body>
</html>
